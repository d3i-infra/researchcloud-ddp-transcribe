---
# Fail fast on missing/invalid required parameters, before any apt churn.

- name: Validate storage_backend
  ansible.builtin.assert:
    that:
      - storage_backend in ['src-volume', 'yoda', 'research-drive']
    fail_msg: >-
      storage_backend '{{ storage_backend }}' is invalid. Choose one of:
      src-volume (SRC-attached / Research Drive mount, rsync), yoda (iRODS
      collection via GoCommands), research-drive (reserved).

- name: Reject research-drive backend (reserved, not yet wired)
  ansible.builtin.fail:
    msg: >-
      storage_backend 'research-drive' is not yet implemented. Mount the
      Research Drive and use the src-volume backend (rsync to its mount point),
      or use the yoda backend. Tracking: docs/FOLLOWUPS.md.
  when: storage_backend == 'research-drive'

- name: Require pipeline_user parameter
  ansible.builtin.assert:
    that:
      - pipeline_user is defined
      - pipeline_user | length > 0
    fail_msg: >-
      Required parameter missing: pipeline_user (workspace user that owns the
      run layout) must be set.

- name: Require Yoda parameters for the yoda backend
  ansible.builtin.assert:
    that:
      - yoda_collection | default('') | length > 0
      - yoda_user | default('') | length > 0
      - yoda_data_access_password | default('') | length > 0
    fail_msg: >-
      The yoda backend requires yoda_collection (iRODS collection base path),
      yoda_user (Yoda username), and yoda_data_access_password. The password
      arrives as a Co-Secret resolved from the CO the workspace is LAUNCHED
      in — create the secret on that CO's Secrets tab (not another CO's) with
      a freshly generated data-access password.
  no_log: true
  when: storage_backend == 'yoda'

- name: Look up pipeline_user account
  ansible.builtin.getent:
    database: passwd
    key: "{{ pipeline_user }}"
    fail_key: false

- name: Fail clearly if pipeline_user is not a real account
  ansible.builtin.assert:
    that:
      - (getent_passwd[pipeline_user] | default([])) | length > 0
    fail_msg: >-
      pipeline_user '{{ pipeline_user }}' is not an account on this workspace.
      Set the pipeline_user parameter to your actual SRC username — the same
      name as in storage_path (e.g. the 'dmccool' in /home/dmccool/...) — not
      the placeholder default.

- name: Record pipeline_user home directory and primary group
  ansible.builtin.set_fact:
    pipeline_home: "{{ getent_passwd[pipeline_user][4] }}"
    pipeline_src_dir: "{{ getent_passwd[pipeline_user][4] }}/src/ddp-transcribe"
    state_dir: "{{ getent_passwd[pipeline_user][4] }}/ddp-state"
    # Hot working set on the boot disk (POSIX fsync, off the NFS-like mount)
    # per ADR 0032: whisper model + transcripts_root live here during a batch.
    work_dir: "{{ getent_passwd[pipeline_user][4] }}/ddp-work"
    # Primary group by gid, NOT the username: SRC-CO provisions users into
    # a CO group (e.g. rsc_co_NNNNNN) with no per-user group.
    pipeline_group: "{{ getent_passwd[pipeline_user][2] }}"

# --- Storage volume resolution -------------------------------------------
# SRC passes parameters as extra-vars, which set_fact cannot override, so the
# raw storage_path INPUT is resolved into the storage_root FACT that every
# consumer (workspace_layout, generated scripts) uses. An unedited portal
# placeholder (contains '<') counts as unset. When unset, auto-detect: SRC
# surfaces attached volumes under <home>/data/<volume-name> — either as the
# mount point itself or as a per-user symlink to a shared mount — so each
# entry there counts as a volume iff it (or its symlink target) appears in
# the mount table; exactly one such entry is unambiguous. Plain directories
# on the boot disk never qualify (no silent boot-disk fallback).
# storage_mounts_source / storage_data_root are testability seams (defaults
# are the real mount table / real data dir).

- name: Record mounted filesystem targets (volume auto-detection input)
  ansible.builtin.set_fact:
    storage_mount_targets: >-
      {{ (storage_mounts_source | default(ansible_mounts))
         | map(attribute='mount') | list }}
    storage_candidates: []
  when: >-
    (storage_path | default('') | length == 0)
    or ('<' in storage_path | default(''))

- name: Inspect the data dir itself (it may be a symlink to a shared mount root)
  ansible.builtin.stat:
    path: "{{ storage_data_root | default(pipeline_home ~ '/data') }}"
    follow: false
  register: storage_data_root_stat
  when: storage_mount_targets is defined

- name: Resolve the real data root (follow a symlinked ~/data)
  ansible.builtin.set_fact:
    storage_data_root_real: >-
      {{ storage_data_root_stat.stat.lnk_source
         if (storage_data_root_stat.stat.islnk | default(false))
         else (storage_data_root | default(pipeline_home ~ '/data')) }}
  when: storage_mount_targets is defined

- name: List entries under the data dir (volumes may be symlinks to a shared mount)
  ansible.builtin.find:
    paths: "{{ storage_data_root_real }}"
    file_type: any
    recurse: false
  register: storage_data_entries
  when: storage_mount_targets is defined

- name: Inspect data-dir entries (symlink targets vs the mount table)
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop: "{{ storage_data_entries.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: storage_entry_stats
  when: storage_mount_targets is defined

- name: Detect attached storage volumes (entry or its symlink target is mounted)
  ansible.builtin.set_fact:
    storage_candidates: "{{ storage_candidates + [item.stat.path] }}"
  loop: "{{ storage_entry_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.stat.path | default('(skipped)') }}"
  when:
    - storage_mount_targets is defined
    - item.stat is defined
    - >-
      (item.stat.islnk | default(false)
       and item.stat.lnk_source | default('') in storage_mount_targets)
      or (item.stat.isdir | default(false)
          and item.stat.path in storage_mount_targets)

- name: Fail on ambiguous storage volume auto-detection
  ansible.builtin.fail:
    msg: >-
      Multiple storage volumes are mounted under
      {{ storage_data_root_real }}
      ({{ storage_candidates | join(', ') }}) — set storage_path explicitly
      to the one the pipeline should use (or detach the others).
  when:
    - storage_candidates is defined
    - storage_candidates | length > 1

- name: Resolve storage_root (explicit storage_path, else the detected volume)
  ansible.builtin.set_fact:
    storage_root: >-
      {{ storage_path
         if (storage_path | default('') | length > 0
             and '<' not in storage_path)
         else (storage_candidates | default([]) | first | default('')) }}

- name: Require a storage volume for mount backends
  ansible.builtin.assert:
    that:
      - storage_root | length > 0
    fail_msg: >-
      The '{{ storage_backend }}' backend needs a storage volume: none was
      auto-detected under {{ storage_data_root_real | default('~/data') }}
      and no usable storage_path was supplied (a value containing '<' is
      treated as an unedited placeholder, i.e. unset). Attach a volume at
      launch (SRC mounts it at /home/<user>/data/<volume-name>), or set
      storage_path to the exact absolute mount path.
  when: storage_backend != 'yoda'

- name: Determine tiered storage mode (yoda backend + interim SRC volume)
  ansible.builtin.set_fact:
    # Tiered when yoda AND a volume resolved (explicit or auto-detected).
    # Volume-less yoda launches resolve storage_root to '' and stay plain.
    tiered_storage: "{{ storage_backend == 'yoda' and storage_root | length > 0 }}"

- name: Check storage_root exists (mount backends + tiered yoda)
  ansible.builtin.stat:
    path: "{{ storage_root }}"
    follow: true   # a volume may be reached via a ~/data symlink
  register: storage_stat
  when: storage_backend != 'yoda' or tiered_storage | bool

- name: Fail if storage_root is not a directory (mount backends + tiered yoda)
  ansible.builtin.fail:
    msg: >-
      storage volume path '{{ storage_root }}' does not exist or is not a
      directory. Attach an external storage volume to the workspace (SRC
      mounts it at /home/<user>/data/<volume-name>) or fix storage_path. For
      the yoda backend a resolved volume activates tiered mode; there is NO
      silent boot-disk fallback.
  when:
    - storage_backend != 'yoda' or tiered_storage | bool
    - not storage_stat.stat.exists or not storage_stat.stat.isdir
